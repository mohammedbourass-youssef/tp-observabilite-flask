apiVersion: 1

contactPoints:
  - orgId: 1
    name: webhook-app
    receivers:
      - uid: webhook-app
        type: webhook
        settings:
          url: http://app:5000/webhook-alerte
          httpMethod: POST

policies:
  - orgId: 1
    receiver: webhook-app
    group_by:
      - alertname
    group_wait: 10s
    group_interval: 30s
    repeat_interval: 1h
