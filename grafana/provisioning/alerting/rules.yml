apiVersion: 1

groups:
  - orgId: 1
    name: grafana-alertes-app
    folder: TP Obs
    interval: 10s
    rules:
      - uid: graf-trafic-eleve
        title: "Grafana - Trafic eleve"
        condition: C
        for: 30s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Plus de 10 requetes/s : {{ $values.B }} req/s"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(rate(app_requetes_total[30s]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [10] }
              datasource: { type: __expr__, uid: __expr__ }

      - uid: graf-taux-erreur
        title: "Grafana - Taux d'erreur eleve"
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Taux d'erreur de {{ $values.B }} % (seuil 5 %)"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 100 * (sum(rate(app_erreurs_total[1m])) or vector(0)) / sum(rate(app_requetes_total[1m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [5] }
              datasource: { type: __expr__, uid: __expr__ }

      - uid: graf-latence-elevee
        title: "Grafana - Latence p95 elevee"
        condition: C
        for: 30s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Latence p95 de {{ $values.B }} s (seuil 1 s)"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: histogram_quantile(0.95, sum(rate(app_latence_secondes_bucket[1m])) by (le))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [1] }
              datasource: { type: __expr__, uid: __expr__ }

      - uid: graf-app-down
        title: "Grafana - Application injoignable"
        condition: C
        for: 20s
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Prometheus ne peut plus scraper l'application"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: min(up{job="application"})
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
              datasource: { type: __expr__, uid: __expr__ }
