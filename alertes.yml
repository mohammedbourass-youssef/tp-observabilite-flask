groups:
  - name: app-alertes
    rules:
      - alert: TropDErreurs
        expr: increase(app_erreurs_total[1m]) > 5
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Trop d'erreurs sur l'application"

      - alert: TraficEleve
        expr: sum(rate(app_requetes_total[30s])) > 10
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Trafic élevé : {{ $value | printf \"%.1f\" }} req/s"

      - alert: TauxErreurEleve
        expr: |
          sum(increase(app_erreurs_total[1m])) > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Plus de 5% des requêtes sont en erreur"

      - alert: AucunTrafic
        expr: sum(rate(app_requetes_total[2m])) == 0
        for: 2m
        labels:
          severity: info
        annotations:
          summary: "Aucune requête reçue depuis 2 minutes"

      - alert: ApplicationInjoignable
        expr: up{job="application"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "L'application ne répond plus au scrape Prometheus"